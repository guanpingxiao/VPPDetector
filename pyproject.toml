[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vppdetector"
version = "1.1.0"
description = "Research scanner and PCART incubation code for variadic-parameter risks"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "VPPDetector contributors"}]
dependencies = [
    "chardet>=3",
    "pcresolve>=1.0.6,<2",
]

[tool.setuptools.packages.find]
include = ["vppdetector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
